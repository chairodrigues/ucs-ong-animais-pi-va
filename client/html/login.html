<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/client/css/base.css">
    <link rel="stylesheet" href="/client/css/login.css">
    <script src="../js/login.js"></script>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required />
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required />
            </div>
            <button type="submit" class="btn" onclick="login()">Entrar</button>
        </form>
        <p class="register-link">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
    </div>
</body>
</html>
